<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Can't reach this page</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; background: radial-gradient(60% 50% at 50% 0%, var(--accent-soft), transparent), var(--bg); }
    .box { max-width: 520px; padding: 24px; }
    .code { font-size: 96px; font-weight: 200; letter-spacing: -4px; color: var(--accent); text-shadow: 0 0 40px var(--accent-glow); line-height: 1; }
    h1 { font-size: 26px; margin: 16px 0 8px; font-weight: 600; }
    p { color: var(--dim); line-height: 1.6; margin: 0 0 6px; }
    .u { color: var(--text); word-break: break-all; }
    .acts { display: flex; gap: 10px; margin-top: 26px; }
    small { color: var(--faint); display: block; margin-top: 24px; font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">:/</div>
    <h1 id="title">Can't reach this page</h1>
    <p id="msg"></p>
    <p class="u" id="url"></p>
    <div class="acts">
      <button class="btn primary" id="retry">Try again</button>
      <button class="btn" id="search">Search for it instead</button>
    </div>
    <small id="code"></small>
  </div>
  <script src="common.js"></script>
  <script src="error.js"></script>
</body>
</html>
