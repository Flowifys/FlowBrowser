<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'">
  <title>Flow Browser</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div id="ribbon"><i></i><i></i></div>

  <div id="chrome">
    <header id="titlebar">
      <button id="logo" class="logo" title="Flow menu"></button>
      <div id="tabstrip">
        <div id="tabs"></div>
        <button id="newtab" class="icon-btn small" title="New tab (Ctrl+T)"></button>
        <div class="drag-fill"></div>
      </div>
      <div id="wincontrols">
        <button id="win-min" title="Minimize"></button>
        <button id="win-max" title="Maximize"></button>
        <button id="win-close" class="close" title="Close"></button>
      </div>
    </header>

    <nav id="toolbar">
      <div class="navgroup">
        <button id="back" class="icon-btn" title="Back (Alt+Left)"></button>
        <button id="forward" class="icon-btn" title="Forward (Alt+Right)"></button>
        <button id="reload" class="icon-btn" title="Reload (Ctrl+R)"></button>
      </div>

      <div id="omnibox">
        <button id="vpn" class="chip vpn" title="Flow VPN"><span class="vpn-dot"></span><span id="vpnlabel">VPN</span></button>
        <div id="site" title="Site information"></div>
        <input id="address" spellcheck="false" autocomplete="off" placeholder="Search with Flow or type a web address">
        <button id="zoomchip" class="chip hidden" title="Reset zoom"></button>
        <button id="shield" class="chip" title="Ads and trackers blocked on this page"></button>
        <button id="star" class="icon-btn small" title="Bookmark this page (Ctrl+D)"></button>
        <div id="suggest" class="hidden"></div>
      </div>

      <div class="rightgroup">
        <div id="np" class="hidden">
          <button id="np-open" class="np-info" title="Open Spotify">
            <span class="np-art"><img id="np-art" alt=""></span>
            <span class="np-text"><b id="np-title"></b><i id="np-artist"></i></span>
          </button>
          <button id="np-prev" class="icon-btn small" title="Previous"></button>
          <button id="np-play" class="icon-btn small np-play" title="Play / pause"></button>
          <button id="np-next" class="icon-btn small" title="Next"></button>
        </div>
        <button id="music" class="icon-btn" title="Spotify"></button>
        <button id="apps" class="icon-btn" title="Side apps"></button>
        <button id="dl" class="icon-btn hidden" title="Downloads (Ctrl+J)"><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"></circle></svg></button>
        <button id="more" class="icon-btn" title="Menu"></button>
      </div>
    </nav>

    <div id="findbar" class="hidden">
      <input id="find" placeholder="Find on page" spellcheck="false">
      <span id="findcount"></span>
      <button id="find-prev" class="icon-btn small" title="Previous (Shift+Enter)"></button>
      <button id="find-next" class="icon-btn small" title="Next (Enter)"></button>
      <button id="find-close" class="icon-btn small" title="Close (Esc)"></button>
    </div>

    <div id="frame"><div id="loadbar"></div></div>
    <div id="panelframe" class="hidden"><div class="panelhead"><span id="panelname"></span><span class="panelbtns"><button id="panelwiden" class="icon-btn small" title="Change width"></button><button id="panelclose" class="icon-btn small" title="Close panel (keeps playing)"></button></span></div></div>
  </div>
  <script src="icons.js"></script>
  <script src="ui.js"></script>
</body>
</html>
